# Shopware 6.7 signs API JWTs with the stable server-side APP_SECRET (HMAC); no RSA JWT files are used.
x-shopware-runtime: &shopware-runtime
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  INSTANCE_ID: ${INSTANCE_ID:?INSTANCE_ID is required}
  BLUE_GREEN_DEPLOYMENT: "0"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  # Stage may use null://null; production must provide its real mail transport.
  MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required}
  # Must identify a shared lock backend across web, worker, and scheduler.
  LOCK_DSN: ${LOCK_DSN:?LOCK_DSN is required}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:?MESSENGER_TRANSPORT_DSN is required}
  MESSENGER_TRANSPORT_LOW_PRIORITY_DSN: ${MESSENGER_TRANSPORT_LOW_PRIORITY_DSN:?MESSENGER_TRANSPORT_LOW_PRIORITY_DSN is required}
  MESSENGER_TRANSPORT_FAILURE_DSN: ${MESSENGER_TRANSPORT_FAILURE_DSN:?MESSENGER_TRANSPORT_FAILURE_DSN is required}
  SHOPWARE_ES_ENABLED: "0"
  SHOPWARE_ES_INDEXING_ENABLED: "0"
  SHOPWARE_HTTP_CACHE_ENABLED: "1"
  TRUSTED_PROXIES: REMOTE_ADDR
  SYMFONY_TRUSTED_PROXIES: REMOTE_ADDR
  JV_MARKET_SALES_CHANNEL_URL_TEMPLATE: https://{domain}

# Aftercool credentials are exposed only to the HTTP entry point and the
# asynchronous importer. Bootstrap and scheduler do not call Aftercool.
x-aftercool-runtime: &aftercool-runtime
  AFTERCOOL_BASE_URI: ${AFTERCOOL_BASE_URI:?AFTERCOOL_BASE_URI is required}
  AFTERCOOL_USERNAME: ${AFTERCOOL_USERNAME:?AFTERCOOL_USERNAME is required}
  AFTERCOOL_PASSWORD: ${AFTERCOOL_PASSWORD:?AFTERCOOL_PASSWORD is required}
  AFTERCOOL_TIMEOUT: ${AFTERCOOL_TIMEOUT:-20}

x-shopware-storage: &shopware-storage
  - ${SHOPWARE_STORAGE_PATH:?SHOPWARE_STORAGE_PATH is required}/files:/var/www/html/files
  - ${SHOPWARE_STORAGE_PATH:?SHOPWARE_STORAGE_PATH is required}/bundles:/var/www/html/public/bundles
  - ${SHOPWARE_STORAGE_PATH:?SHOPWARE_STORAGE_PATH is required}/media:/var/www/html/public/media
  - ${SHOPWARE_STORAGE_PATH:?SHOPWARE_STORAGE_PATH is required}/thumbnail:/var/www/html/public/thumbnail
  - ${SHOPWARE_STORAGE_PATH:?SHOPWARE_STORAGE_PATH is required}/theme:/var/www/html/public/theme
  - ${SHOPWARE_STORAGE_PATH:?SHOPWARE_STORAGE_PATH is required}/sitemap:/var/www/html/public/sitemap

services:
  bootstrap:
    build: { context: ., dockerfile: Dockerfile.deploy }
    restart: "no"
    mem_limit: ${BOOTSTRAP_MEMORY_LIMIT:-1536m}
    cpus: ${BOOTSTRAP_CPU_LIMIT:-2.0}
    pids_limit: ${BOOTSTRAP_PIDS_LIMIT:-512}
    user: "33:33"
    command: ["vendor/bin/shopware-deployment-helper", "run", "--timeout=900"]
    environment:
      <<: *shopware-runtime
      INSTALL_LOCALE: ${INSTALL_LOCALE:?INSTALL_LOCALE is required}
      INSTALL_CURRENCY: ${INSTALL_CURRENCY:?INSTALL_CURRENCY is required}
      INSTALL_ADMIN_USERNAME: ${INSTALL_ADMIN_USERNAME:?INSTALL_ADMIN_USERNAME is required}
      INSTALL_ADMIN_PASSWORD: ${INSTALL_ADMIN_PASSWORD:?INSTALL_ADMIN_PASSWORD is required}
      INSTALL_ADMIN_EMAIL: ${INSTALL_ADMIN_EMAIL:?INSTALL_ADMIN_EMAIL is required}
      SALES_CHANNEL_URL: ${SALES_CHANNEL_URL:?SALES_CHANNEL_URL is required}
    volumes: *shopware-storage
    networks: [database]

  web:
    build: { context: ., dockerfile: Dockerfile.deploy }
    restart: unless-stopped
    init: true
    mem_limit: ${WEB_MEMORY_LIMIT:-1536m}
    cpus: ${WEB_CPU_LIMIT:-2.0}
    pids_limit: ${WEB_PIDS_LIMIT:-512}
    stop_grace_period: 30s
    environment:
      <<: [*shopware-runtime, *aftercool-runtime]
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    volumes: *shopware-storage
    networks:
      database: {}
      application:
        aliases:
          - ${SHOPWARE_NETWORK_ALIAS:?SHOPWARE_NETWORK_ALIAS is required}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(empty(preg_grep(\"#^HTTP/\\S+ 200 #\", @get_headers(\"http://127.0.0.1/api/_info/health-check\") ?: [])));'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    user: "33:33"
    build: { context: ., dockerfile: Dockerfile.deploy }
    restart: unless-stopped
    init: true
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}
    cpus: ${WORKER_CPU_LIMIT:-1.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-256}
    stop_grace_period: 60s
    command: ["php", "bin/console", "messenger:consume", "async", "low_priority", "--memory-limit=512M", "--time-limit=3600"]
    environment:
      <<: [*shopware-runtime, *aftercool-runtime]
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    volumes: *shopware-storage
    networks: [database, application]

  scheduler:
    user: "33:33"
    build: { context: ., dockerfile: Dockerfile.deploy }
    restart: unless-stopped
    init: true
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-768m}
    cpus: ${SCHEDULER_CPU_LIMIT:-1.0}
    pids_limit: ${SCHEDULER_PIDS_LIMIT:-256}
    stop_grace_period: 60s
    command: ["php", "bin/console", "scheduled-task:run", "--memory-limit=512M", "--time-limit=3600"]
    environment: *shopware-runtime
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    volumes: *shopware-storage
    networks: [database, application]

networks:
  database:
    external: true
    name: ${DATA_NETWORK:?DATA_NETWORK is required}
  application:
    external: true
    name: ${APP_NETWORK:?APP_NETWORK is required}
