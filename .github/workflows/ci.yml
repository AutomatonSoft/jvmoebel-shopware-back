name: CI

on:
  pull_request:
    branches:
      - develop
      - stage
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint / analyse / test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      APP_ENV: test
      APP_URL: http://localhost:8000
      APP_SECRET: local-ci-only-not-a-production-secret
      INSTANCE_ID: "00000000000000000000000000000000"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/shopware
      MAILER_DSN: "null://null"
      TEST_REDIS_DSN: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/messages
      MESSENGER_TRANSPORT_LOW_PRIORITY_DSN: redis://127.0.0.1:6379/low_priority
      MESSENGER_TRANSPORT_FAILURE_DSN: redis://127.0.0.1:6379/failed
      # Integration suite does not exercise OpenSearch paths; keep ES disabled and omit the service.
      OPENSEARCH_URL: http://127.0.0.1:9200
      ADMIN_OPENSEARCH_URL: http://127.0.0.1:9200
      SHOPWARE_ES_ENABLED: "0"
      SHOPWARE_ES_INDEXING_ENABLED: "0"
      SHOPWARE_ES_INDEX_PREFIX: sw
      LOCK_DSN: flock
      BLUE_GREEN_DEPLOYMENT: "0"
      JV_MARKET_SALES_CHANNEL_URL_TEMPLATE: "https://{domain}"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopware
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate setup script syntax
        run: bash -n bin/setup-local

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: gd, intl, pdo_mysql, zip, xml, curl, mbstring, sodium
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: Analyse
        run: composer analyse

      - name: Test
        run: composer test -- --testdox

  administration:
    name: administration build / assets sync
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: local-ci-only-not-a-production-secret
      INSTANCE_ID: "00000000000000000000000000000000"
      # bin/ci can run without a real DB for bundle dump
      DATABASE_URL: "mysql://_placeholder.test"
      CI: "1"
      SHOPWARE_SKIP_ENTITY_SCHEMA_DUMP: "1"
      SHOPWARE_SKIP_ASSET_COPY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: gd, intl, pdo_mysql, zip, xml, curl, mbstring, sodium
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build Administration
        run: bash bin/build-administration.sh

      - name: Fail if Administration assets are stale
        run: |
          git diff --exit-code -- \
            custom/static-plugins/JvCms/src/Resources/public/administration \
            custom/static-plugins/JvImport/src/Resources/public/administration \
            || {
              echo "Administration source and committed production assets differ."
              echo "Run: docker compose exec web bash bin/build-administration.sh"
              echo "Then commit updated Resources/public/administration."
              git status --short -- \
                custom/static-plugins/JvCms/src/Resources/public/administration \
                custom/static-plugins/JvImport/src/Resources/public/administration
              exit 1
            }
