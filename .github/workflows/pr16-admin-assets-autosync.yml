name: Temporary PR16 administration asset sync

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.number == 16 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/cms-jv-room-grid'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: local-ci-only-not-a-production-secret
      INSTANCE_ID: "00000000000000000000000000000000"
      DATABASE_URL: "mysql://_placeholder.test"
      CI: "1"
      SHOPWARE_SKIP_ENTITY_SCHEMA_DUMP: "1"
      SHOPWARE_SKIP_ASSET_COPY: "1"

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: gd, intl, pdo_mysql, zip, xml, curl, mbstring, sodium
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build Administration
        run: bash bin/build-administration.sh

      - name: Commit exact generated Administration assets
        run: |
          git add -- \
            custom/static-plugins/JvCms/src/Resources/public/administration \
            custom/static-plugins/JvImport/src/Resources/public/administration

          if git diff --cached --quiet; then
            echo "No generated Administration changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync administration assets for jv-room-grid"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
