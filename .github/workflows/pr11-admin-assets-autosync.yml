name: Temporary PR11 administration asset sync

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.number == 11 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/admin-build-trailing-newline'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: local-ci-only-not-a-production-secret
      INSTANCE_ID: "00000000000000000000000000000000"
      DATABASE_URL: "mysql://_placeholder.test"
      CI: "1"
      SHOPWARE_SKIP_ENTITY_SCHEMA_DUMP: "1"
      SHOPWARE_SKIP_ASSET_COPY: "1"

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: gd, intl, pdo_mysql, zip, xml, curl, mbstring, sodium
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build Administration
        run: bash bin/build-administration.sh

      - name: Diagnose exact generated changes
        shell: bash
        run: |
          echo '=== git status --short ==='
          git status --short
          echo '=== git diff --stat ==='
          git diff --stat
          echo '=== git diff --numstat ==='
          git diff --numstat
          echo '=== git diff --name-only ==='
          git diff --name-only

          unexpected=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              custom/static-plugins/*/src/Resources/public/administration/.vite/*.json|custom/static-plugins/*/src/Resources/public/administration/assets/*.map)
                ;;
              *)
                echo "::error::Unexpected path class: $path"
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only)

          if [[ "$unexpected" -ne 0 ]]; then
            exit 1
          fi

          echo 'Diagnostic only: no commit or push is performed in this run.'
          exit 1
