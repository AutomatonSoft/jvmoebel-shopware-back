url: ""
compatibility_date: "2026-08-02"
docker:
  php:
    version: "8.5"
environments:
  local:
    type: docker
    url: http://127.0.0.1:8000

deployment:
  extension-management:
    enabled: true
    force-update:
      - JvMarketConfiguration
      - JvCms
      - JvSeo
      - JvImport
      - JvStorefront
  hooks:
    post:
      - title: Configure JVMöbel sales channels
        script: bin/console jv:markets:bootstrap --no-interaction
      - title: Configure CosmoShop import profiles
        script: bin/console jv:catalog:bootstrap-import-profiles --no-interaction
      - title: Register project scheduled tasks
        script: bin/console scheduled-task:register --no-interaction
      - title: Sync Administration bundle assets
        script: bin/console assets:install --force --no-interaction
  one-time-tasks:
    - id: opensearch-initial-index
      script: |-
        [ "${SHOPWARE_ES_INDEXING_ENABLED:-0}" = "1" ] || exit 0
        for attempt in $(seq 60); do
          php -r 'exit(@file_get_contents(getenv("OPENSEARCH_URL") . "/_cluster/health?wait_for_status=yellow&timeout=5s") === false ? 1 : 0);' && exec bin/console es:index --no-interaction --no-progress
          sleep 5
        done
        exit 1
